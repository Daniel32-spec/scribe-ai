<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribePro SL | Professional Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Essential Libraries -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="dashboard">
        <!-- Sidebar: Project & AI Controls -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-box">S</div>
                <h2>ScribePro <span>SL</span></h2>
            </div>

            <div class="nav-section">
                <label>PROJECT IDENTIFICATION</label>
                <input type="text" id="project-id" placeholder="e.g., KAI_FGD_002_HSSEP">
                <input type="text" id="client-name" placeholder="Client (e.g., GIZ)">
            </div>

            <div class="nav-section">
                <label>SPEAKER LABELS</label>
                <div class="speaker-input">
                    <span>S1</span><input type="text" id="s1-label" value="Interviewer">
                </div>
                <div class="speaker-input">
                    <span>S2</span><input type="text" id="s2-label" value="Respondent">
                </div>
            </div>

            <div class="ai-status-card">
                <div class="status-header">
                    <span id="ai-status">AI Ready</span>
                    <div class="indicator" id="ai-indicator"></div>
                </div>
                <div class="progress-track">
                    <div id="ai-progress"></div>
                </div>
                <small id="ai-detail">Translating SL Dialects to English</small>
            </div>

            <button id="export-word" class="btn-primary">Download Word (.docx)</button>
        </aside>

        <!-- Main Content: Audio & Editor -->
        <main class="content">
            <header class="content-header">
                <div class="upload-box">
                    <input type="file" id="audio-input" accept="audio/*" hidden>
                    <label for="audio-input" class="upload-label">📁 Click to Upload Project Audio</label>
                </div>
                <div id="waveform-container">
                    <div id="waveform"></div>
                    <div class="wave-info">
                        <button id="play-pause">Play / Pause</button>
                        <span id="time-display">00:00 / 00:00</span>
                    </div>
                </div>
            </header>

            <section class="editor-workspace">
                <div class="editor-header">
                    <h3>TRANSCRIPT EDITOR</h3>
                    <p>AI will translate Mende/Temne/Krio into English text below.</p>
                </div>
                <div id="transcript-output" contenteditable="true">
                    <!-- Transcription flows here -->
                    <div class="empty-prompt">Upload an audio file to begin professional transcription...</div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
