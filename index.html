<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScribePro SL | HSSEP Professional Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar for Metadata & Controls -->
        <aside class="sidebar">
            <div class="logo">
                <h1>SCRIBE<span>PRO</span></h1>
                <p>SL Transcription Suite</p>
            </div>

            <div class="metadata-section">
                <h3>NGO / PROJECT METADATA</h3>
                <input type="text" id="meta-code" placeholder="File Code (e.g., KAI_FGD_002)" value="KAI_FGD_002_KOMPASS">
                <input type="text" id="meta-project" placeholder="Project Name" value="HSSEP Project">
                <input type="text" id="meta-funder" placeholder="Funder" value="GIZ">
                <input type="text" id="meta-location" placeholder="Location/Facility">
            </div>

            <div class="speaker-legend">
                <h3>SPEAKER IDENTIFICATION</h3>
                <div class="speaker-input"><span>I:</span><input type="text" id="label-i" value="Interviewer"></div>
                <div class="speaker-input"><span>R3:</span><input type="text" id="label-r3" value="Respondent 3"></div>
                <div class="speaker-input"><span>R5:</span><input type="text" id="label-r5" value="Respondent 5"></div>
                <div class="speaker-input"><span>R8:</span><input type="text" id="label-r8" value="Respondent 8"></div>
            </div>

            <div class="actions">
                <input type="file" id="audio-input" accept="audio/*" hidden>
                <label for="audio-input" class="btn-primary">UPLOAD PROJECT AUDIO</label>
                <button id="export-docx" class="btn-secondary">EXPORT TO MS WORD (.docx)</button>
                <div class="ai-status">
                    <span>AI Engine Status:</span>
                    <div id="status-bulb"></div>
                    <span id="status-msg">Idle</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <div id="waveform-display"></div>
            <div class="playback-controls">
                <button id="btn-play">Play/Pause</button>
                <span id="timer">00:00 / 00:00</span>
            </div>

            <div class="transcript-editor">
                <div class="editor-toolbar">
                    <span>DIALOGUE EDITOR</span>
                    <small>Auto-saves to browser</small>
                </div>
                <!-- This area will be populated by the AI but remains editable -->
                <div id="dialogue-container" contenteditable="true">
                    <p class="hint">Upload the FGD audio file to begin AI transcription...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
