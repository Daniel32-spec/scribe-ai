<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribePro SL | Professional Suite</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="icon">G</div>
                <h2>ScribePro <span>SL</span></h2>
            </div>
            
            <div class="sidebar-content">
                <div class="input-group">
                    <label>Project Name</label>
                    <input type="text" id="project-id" placeholder="KAI_FGD_001">
                </div>

                <div class="status-card">
                    <div class="status-info">
                        <span id="ai-status">Ready</span>
                        <div class="pulse" id="pulse"></div>
                    </div>
                    <div class="progress-bar"><div id="progress-fill"></div></div>
                    <small>Translation Engine: Whisper-Small</small>
                </div>
                
                <button id="export-docx" class="btn-export">💾 Download Word File</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- STEP 1: UPLOAD AREA (Now Highly Visible) -->
            <header class="upload-zone" id="drop-zone">
                <input type="file" id="audio-input" accept="audio/*" hidden>
                <div class="upload-prompt">
                    <img src="https://cdn-icons-png.flaticon.com/512/3303/3303923.png" width="40">
                    <h3>CLICK HERE TO UPLOAD AUDIO</h3>
                    <p id="file-name">No file selected yet</p>
                </div>
            </header>

            <!-- STEP 2: PROFESSIONAL PLAYER -->
            <section class="player-container">
                <div id="waveform"></div>
                <div class="controls">
                    <button id="play-pause" class="btn-play">Play / Pause</button>
                    
                    <!-- GOOGLE TRANSLATE STYLE ICON -->
                    <button id="translate-trigger" class="btn-google-translate" title="Start AI Transcription">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Google_Translate_logo.svg" width="24">
                        <span>Tap to Transcribe</span>
                    </button>
                    
                    <span id="time-display">00:00 / 00:00</span>
                </div>
            </section>

            <!-- STEP 3: EDITOR BOX -->
            <section class="editor-area">
                <div class="editor-header">
                    <h4>TRANSCRIPT EDITOR</h4>
                    <small>Mende / Temne / Krio ➔ English</small>
                </div>
                <div id="editor-box" contenteditable="true">
                    <p class="placeholder">Audio text will appear here once you tap the Google icon...</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
