<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribePro SL | Premium AI Transcription</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <!-- Smooth Animated Background -->
    <div class="bg-gradient"></div>

    <div class="glass-app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"></div>
                <h1>ScribePro <span>SL</span></h1>
            </div>

            <div class="meta-card">
                <label>Audio Identity</label>
                <input type="text" id="project-name" placeholder="Project Code / Name">
                <div class="file-stats">
                    <span id="duration">00:00</span> • <span id="file-size">0.0 MB</span>
                </div>
            </div>

            <div class="speaker-config">
                <label>Active Speakers</label>
                <div class="speaker-pill active">
                    <span class="dot interviewer"></span>
                    <span>Interviewer</span>
                </div>
                <div class="speaker-pill">
                    <span class="dot respondent"></span>
                    <span>Respondent</span>
                </div>
            </div>

            <div class="status-panel">
                <div class="status-top">
                    <span id="engine-status">Engine Ready</span>
                    <div class="pulse-ring"></div>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <p id="status-detail">Optimized for Sierra Leonean Dialects</p>
            </div>

            <button id="export-btn" class="glass-btn primary">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732220.png" width="16">
                Export to Word
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="workspace-nav">
                <div class="upload-container">
                    <input type="file" id="audio-input" accept="audio/*" hidden>
                    <label for="audio-input" class="upload-trigger">
                        <span>Click to upload project audio</span>
                    </label>
                </div>
                
                <div class="wave-area">
                    <div id="waveform"></div>
                    <div class="wave-controls">
                        <button id="play-btn" class="play-circle">▶</button>
                        <small>Click words to jump audio</small>
                    </div>
                </div>
            </header>

            <div class="editor-view">
                <div id="transcript-editor" contenteditable="true">
                    <div class="empty-state">
                        <p>Waiting for audio input...</p>
                        <span>Mende • Temne • Krio • English</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
